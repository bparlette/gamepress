// ---------------------------------------------------------------- params
const QS = new URLSearchParams(location.search);
const SPECTATE = QS.has('spectate') || QS.get('auto') === '1';
const AUTOSTART = SPECTATE || QS.has('autostart') || QS.has('auto');
const SEED = +(QS.get('seed') || 7);

// seeded rng for deterministic gameplay (AI, round flow)
let _s = SEED >>> 0;
const srand = () => { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const srange = (a, b) => a + srand() * (b - a);

// ---------------------------------------------------------------- touch controls
// Industry-standard mobile layout: left half = floating virtual joystick
// (appears under the thumb anywhere you touch), right half = circular
// action buttons (ATTACK + STANCE cycle). PointerEvent + pointerId tracking
// so joystick and buttons never interfere.
class TouchController {
  constructor() {
    this.maxRadius = 60;
    this.vector = { x: 0, y: 0 };
    this.buttons = { a: false, b: false };
    this._aEdge = false; this._bEdge = false;   // edge-triggered pulses
    this.activeStickId = null;
    this.stickOrigin = { x: 0, y: 0 };
    this.overlay = document.getElementById('tc-overlay');
    this.base = document.getElementById('tc-base');
    this.knob = document.getElementById('tc-knob');
    this.btnA = document.getElementById('tc-atk');
    this.btnB = document.getElementById('tc-stc');
    this._btnAId = null; this._btnBId = null;
    this.enabled = false;
    this._bind();
  }
  _bind() {
    this.overlay.addEventListener('pointerdown', e => {
      if (!this.enabled) return;
      e.preventDefault();
      const mid = window.innerWidth / 2;
      // Right half: action buttons first (they're on top visually)
      if (this._hit(e, this.btnA) && this._btnAId === null) {
        this._btnAId = e.pointerId; this.buttons.a = true; this._aEdge = true;
        this.btnA.classList.add('hit'); return;
      }
      if (this._hit(e, this.btnB) && this._btnBId === null) {
        this._btnBId = e.pointerId; this.buttons.b = true; this._bEdge = true;
        this.btnB.classList.add('hit'); return;
      }
      // Left half: floating joystick anchors under the thumb
      if (e.clientX < mid && this.activeStickId === null) {
        this.activeStickId = e.pointerId;
        this.stickOrigin = { x: e.clientX, y: e.clientY };
        this.base.style.left = e.clientX + 'px'; this.base.style.top = e.clientY + 'px';
        this.base.style.display = 'block';
        this.knob.style.left = e.clientX + 'px'; this.knob.style.top = e.clientY + 'px';
        this.knob.style.display = 'block';
      }
    });
    this.overlay.addEventListener('pointermove', e => {
      if (e.pointerId === this.activeStickId) {
        const dx = e.clientX - this.stickOrigin.x, dy = e.clientY - this.stickOrigin.y;
        const dist = Math.hypot(dx, dy), angle = Math.atan2(dy, dx);
        const cd = Math.min(dist, this.maxRadius);
        const knobX = this.stickOrigin.x + Math.cos(angle) * cd;
        const knobY = this.stickOrigin.y + Math.sin(angle) * cd;   // (bugfix: was a stray && expr)
        this.knob.style.left = knobX + 'px'; this.knob.style.top = knobY + 'px';
        const m = cd / this.maxRadius;
        this.vector.x = Math.cos(angle) * m; this.vector.y = Math.sin(angle) * m;
      }
    });
    const release = e => {
      if (e.pointerId === this.activeStickId) {
        this.activeStickId = null; this.vector.x = 0; this.vector.y = 0;
        this.base.style.display = 'none'; this.knob.style.display = 'none';
      }
      if (e.pointerId === this._btnAId) { this._btnAId = null; this.buttons.a = false; this.btnA.classList.remove('hit'); }
      if (e.pointerId === this._btnBId) { this._btnBId = null; this.buttons.b = false; this.btnB.classList.remove('hit'); }
    };
    this.overlay.addEventListener('pointerup', release);
    this.overlay.addEventListener('pointercancel', release);
    // don't let the browser take over gestures on the overlay
    this.overlay.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  }
  _hit(e, el) {
    const r = el.getBoundingClientRect();
    const pad = 14; // generous touch deadzone
    return e.clientX >= r.left - pad && e.clientX <= r.right + pad &&
           e.clientY >= r.top - pad && e.clientY <= r.bottom + pad;
  }
  show() { this.enabled = true; this.overlay.style.display = 'block'; }
  hide() { this.enabled = false; this.overlay.style.display = 'none'; }
  setStanceLabel(s) { this.btnB.textContent = s; }
  // consume one-shot attack / stance presses
  takeA() { const v = this._aEdge; this._aEdge = false; return v; }
  takeB() { const v = this._bEdge; this._bEdge = false; return v; }
}
const tc = new TouchController();

// ---------------------------------------------------------------- audio
let AC = null;
const ac = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
function tone(freq, dur, type = 'sine', vol = 0.25, slide = 0) {
  try {
    const c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur);
  } catch {}
}
function noiseBurst(dur = 0.2, vol = 0.3, low = 400) {
  try {
    const c = ac(), n = c.createBufferSource(), b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
    const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = b; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = low;
    const g = c.createGain(); g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    n.connect(f).connect(g).connect(c.destination); n.start();
  } catch {}
}
const WEAPON_SFX = {
  katana:   { log: ['whoosh', 'crash'], swing: () => noiseBurst(0.12, 0.2, 4000), hit: () => { tone(180, 0.25, 'sawtooth', 0.3, -120); noiseBurst(0.15, 0.25, 2500); } },
  chainsaw: { log: ['zoom', 'boom'], swing: () => { tone(70, 0.5, 'sawtooth', 0.35, 40); noiseBurst(0.4, 0.3, 900); }, hit: () => { tone(55, 0.7, 'sawtooth', 0.45, -20); noiseBurst(0.5, 0.4, 700); } },
  pillow:   { log: ['whoosh', 'splat'], swing: () => noiseBurst(0.1, 0.12, 1200), hit: () => { noiseBurst(0.3, 0.3, 3000); tone(500, 0.15, 'sine', 0.15, 200); } },
  bunny:    { log: ['tick', 'pop'], swing: () => tone(700, 0.08, 'sine', 0.12, 300), hit: () => tone(880, 0.18, 'sine', 0.3, 440) },
  fryingpan:{ log: ['whoosh', 'thud'], swing: () => noiseBurst(0.1, 0.18, 2000), hit: () => { tone(140, 0.4, 'square', 0.4, -80); tone(210, 0.3, 'triangle', 0.3, -100); } },
  bat:      { log: ['whoosh', 'crunch'], swing: () => noiseBurst(0.12, 0.2, 2500), hit: () => { tone(120, 0.3, 'sawtooth', 0.35, -60); noiseBurst(0.2, 0.3, 1500); } },
  baguette: { log: ['whoosh', 'snap'], swing: () => noiseBurst(0.08, 0.12, 3000), hit: () => { noiseBurst(0.25, 0.3, 4000); tone(300, 0.12, 'triangle', 0.2, -150); } },
  chicken:  { log: ['tick', 'pop'], swing: () => tone(600, 0.08, 'sine', 0.1, 200), hit: () => { tone(750, 0.12, 'sine', 0.3, 350); setTimeout(() => tone(650, 0.12, 'sine', 0.25, 300), 90); } },
};

// ---------------------------------------------------------------- arena
// Stylized dojo at dusk: wood platform, shoji screens, bamboo, sakura, lanterns.
{

  // platform

  sun.position.set(14, 5.5, -38); sun.lookAt(0, 2, 0); st.scene.add(sun);
  // ground beyond platform (dark)

}
// cherry blossom petals (instanced, drifting)
const PETALS = 90;
const petalMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.14, 0.1),
  new THREE.MeshBasicMaterial({ color: 0xf7b8d0, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }), PETALS);
st.scene.add(petalMesh);
const petalState = [];
for (let i = 0; i < PETALS; i++) petalState.push({ x: rand(-9, 9), y: rand(0, 7), z: rand(-6, 5), vy: rand(0.25, 0.6), ph: rand(0, 6.28), spin: rand(1, 3) });
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _sv = new THREE.Vector3(1, 1, 1);
function tickPetals(dt) {
  for (let i = 0; i < PETALS; i++) {
    const p = petalState[i];
    p.y -= p.vy * dt; p.x += Math.sin(st.t * 0.8 + p.ph) * dt * 0.5; p.ph += p.spin * dt;
    if (p.y < 0) { p.y = rand(5, 7.5); p.x = rand(-9, 9); p.z = rand(-6, 5); }
    _e.set(p.ph, p.ph * 0.7, 0); _q.setFromEuler(_e); _v.set(p.x, p.y, p.z);
    _m4.compose(_v, _q, _sv); petalMesh.setMatrixAt(i, _m4);
  }

}
// spark / feather particle pool

// shockwave rings on kill
const shockwaves = [];
function shockwave(pos, color = 0xffe08a) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.7, 0.95, 32),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(pos.x, 0.12, pos.z);
  st.scene.add(m); shockwaves.push({ m, t: 0 });
}
function tickShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i]; s.t += dt;
    const k = s.t / 0.55;
    if (k >= 1) { st.scene.remove(s.m); s.m.geometry.dispose(); s.m.material.dispose(); shockwaves.splice(i, 1); continue; }
    const sc = 0.6 + k * 3.6; s.m.scale.set(sc, sc, 1);
    s.m.material.opacity = 0.9 * (1 - k);
  }
}

// ---------------------------------------------------------------- fighters

function buildWeaponMesh(id) {
  const g = new THREE.Group();

    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); g.add(m); return m;

      add(new THREE.ConeGeometry(0.035, 0.07, 4), toon(0x666c78), 0.045, 0.55 + i * 0.085, 0, 0, 0, -Math.PI / 2);
      add(new THREE.ConeGeometry(0.035, 0.07, 4), toon(0x666c78), -0.045, 0.55 + i * 0.085, 0, 0, 0, Math.PI / 2);
    }
    add(new THREE.CylinderGeometry(0.03, 0.03, 0.24, 8), toon(0x333333), 0, 0.02, 0); // handle
  } else if (id === 'pillow') {
    const p = add(new THREE.SphereGeometry(0.34, 12, 10), toon(0xf6f2ea), 0, 0.42, 0);

  } else if (id === 'fryingpan') {

    add(new THREE.CylinderGeometry(0.2, 0.2, 0.075, 16), toon(0x565c66), 0, 0.5, 0);  // inner
    add(new THREE.BoxGeometry(0.07, 0.42, 0.07), toon(0x4a2e1a), 0, 0.12, 0);          // handle
  } else if (id === 'bat') {

    for (let i = 0; i < 6; i++) {                                                      // spikes

    }

    add(new THREE.SphereGeometry(0.07, 8, 6), toon(0xc8924a), 0, 0.1, 0);
    for (let i = 0; i < 3; i++) add(new THREE.BoxGeometry(0.075, 0.02, 0.02), toon(0xa8783a), 0, 0.85 + i * 0.12, 0.065, 0.4, 0, 0);
    add(new THREE.CylinderGeometry(0.035, 0.035, 0.2, 8), toon(0x8a6a4a), 0, 0.0, 0);
  } else { // chicken
    add(new THREE.SphereGeometry(0.17, 10, 8), toon(0xf6f0e0), 0, 0.35, 0);           // body
    add(new THREE.SphereGeometry(0.1, 8, 6), toon(0xf6f0e0), 0, 0.52, 0.06);          // head
    add(new THREE.ConeGeometry(0.045, 0.1, 8), toon(0xe88a2a), 0, 0.52, 0.17, Math.PI / 2, 0, 0); // beak
    add(new THREE.SphereGeometry(0.03, 6, 6), toon(0x222222), -0.04, 0.55, 0.12);
    add(new THREE.SphereGeometry(0.03, 6, 6), toon(0x222222), 0.04, 0.55, 0.12);
    add(new THREE.BoxGeometry(0.02, 0.12, 0.06), toon(0xe88a2a), 0, 0.62, 0);          // comb
    add(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 8), toon(0x8a6a4a), 0, 0.05, 0);
  }
  return g;
}

// Duelist rig built on gpchar's procedural humanoid — real proportions, face,
// jointed limbs. Same parts interface the combat code expects.
function buildFighterMesh(color) {
  const rig = buildHumanoid({ gi: color, hair: 'headband', armor: true, skirt: true });
  const J = rig.joints;
  const parts = {
    legL: J.hipL, legR: J.hipR,
    torso: J.chest,
    head: J.head,
    armR: J.shoulderR, armL: J.shoulderL,
    hand: J.wristR,
    weaponMount: rig.parts.weaponMount,
    tail1: rig.parts.tail1, tail2: rig.parts.tail2,
  };
  return { group: rig.group, parts, rig };
}

// Stance poses: [armR.rotation.z, armR.rotation.x, torsoY, headY, crouch]
const STANCE_POSE = {
  [STANCE.HIGH]: { armZ: -2.4, armX: 0,   crouch: 0,    lean: 0.06 },
  [STANCE.MID]:  { armZ: -1.35, armX: 0,   crouch: 0.04, lean: 0.1 },
  [STANCE.LOW]:  { armZ: -0.7, armX: 0.3,  crouch: 0.3,  lean: 0.22 },
};

// ---------------------------------------------------------------- duelist
// Wires a BladeFighter (pure logic) to a three.js rig.
class Duelist {
  constructor(name, color, facing, weaponId, isBot) {
    this.name = name; this.facing = facing; this.isBot = isBot;
    this.weaponId = weaponId; this.weapon = WEAPONS[weaponId];
    const rig = buildFighterMesh(color);
    this.group = rig.group; this.parts = rig.parts; this.rig = rig.rig;
    this.weaponMesh = buildWeaponMesh(weaponId);
    this.weaponMesh.scale.setScalar(1.18); // read clearly at a glance
    this.weaponMats = [];
    this.weaponMesh.traverse(o => { if (o.isMesh) { this.weaponMats.push(o.material); } });
    this.parts.weaponMount.add(this.weaponMesh);
    // slash trail arc (additive, shown during active frames)
    this.trail = new THREE.Mesh(
      new THREE.RingGeometry(0.95, 1.5, 24, 1, 0, Math.PI * 0.8),
      new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    this.trail.visible = false; st.scene.add(this.trail);
    // orient weapon along arm: rotate mount so blade points "up" from hand
    this.weaponMesh.rotation.z = Math.PI / 2 * 0; // blade extends +Y in local space
    this.x = 0; this.z = 0; this.vx = 0; this.vz = 0;
    this.walkPh = Math.random() * 6;
    this.swingT = 0;         // 0..1 attack sweep progress (visual)
    this.deadFall = 0;       // death animation 0..1
    this.droppedWeapon = null;
    const self = this;
    this.fighter = new BladeFighter(this.weapon, {
      getSegment: () => self._segment(),
      getZones: () => self._zones(),
      onEvent: (n, d) => self._onCombatEvent(n, d),
    });
    this.group.position.set(this.x, 0, this.z);
    st.scene.add(this.group);
  }

  get stance() { return this.fighter.stance; }
  get alive() { return this.fighter.alive; }

  // weapon direction in world space, animated by combat state
  _weaponDir() {
    const f = this.fighter, w = this.weapon, fx = this.facing;
    const rest = { [STANCE.HIGH]: [0.35, 0.9], [STANCE.LOW]: [0.75, -0.35] }[f.stance] || [0.95, 0.05];
    let dx, dy;
    if (f.state === FSTATE.WINDUP) {
      const t = Math.min(1, f.frame / Math.max(1, w.windup));
      dx = rest[0] + (-0.55 - rest[0]) * t; dy = rest[1] + (0.45) * t; // pull back & up
    } else if (f.state === FSTATE.ATTACKING) {
      const t = Math.min(1, f.frame / Math.max(1, w.active));
      const e = 1 - Math.pow(1 - t, 3);
      const strike = { [STANCE.HIGH]: [0.55, -0.85], [STANCE.LOW]: [0.6, 0.75] }[f.stance] || [1.0, 0.0];
      const back = [-0.55, rest[1] + 0.45];
      dx = back[0] + (strike[0] - back[0]) * e; dy = back[1] + (strike[1] - back[1]) * e;
    } else if (f.state === FSTATE.RECOIL) { dx = rest[0] * 0.4; dy = rest[1] * 0.4 + 0.3; }
    else { dx = rest[0]; dy = rest[1]; }
    const len = Math.hypot(dx, dy) || 1;
    return { x: dx / len * fx, y: dy / len, z: 0 };
  }

  _segment() {
    const h = new THREE.Vector3();
    this.parts.hand.getWorldPosition(h);
    const d = this._weaponDir(), r = this.weapon.reach;
    return { hilt: { x: h.x, y: h.y, z: h.z }, tip: { x: h.x + d.x * r, y: h.y + d.y * r, z: h.z + d.z * r } };
  }

  _zones() {
    const pose = STANCE_POSE[this.fighter.stance];
    const crouch = this.fighter.crippled ? 0.42 : pose.crouch;
    const x = this.x, z = this.z, fx = this.facing;
    return {
      [ZONE.HEAD]:  { x: x + fx * 0.08, y: 1.32 - crouch * 0.55, z, r: 0.24 },
      [ZONE.TORSO]: { x, y: 0.86 - crouch * 0.35, z, r: 0.32 },
      [ZONE.LEGS]:  { x: x - fx * 0.05, y: 0.34 - crouch * 0.2, z, r: 0.26 },
      [ZONE.ARM]:   { x: x + fx * 0.34, y: 1.02 - crouch * 0.3, z: z - 0.2 * fx, r: 0.2 },
    };
  }

  _onCombatEvent(n, d) {
    const pos = { x: this.x + this.facing * 0.5, y: 1.3, z: this.z };
    if (n === 'swing') { wswing(this.weaponId); this.vx += this.facing * 2.2; /* attack lunge */ }
    else if (n === 'clash') { /* handled in resolve */ }
    else if (n === 'kill') {
      const label = { head: 'HEAD', torso: 'TORSO', chainsaw: 'CHAINSAW', 'bunny-headshot': 'BUNNY HEADSHOT' }[d.cause] || d.cause.toUpperCase();
      st.popup(`LETHAL — ${label} ${WEAPON_EMOJI[this.weaponId]}`, pos, '#ff5b4d', 7);
      st.flash('#ff2a2a', 0.35); st.shake(10); st.slowmo(0.25, 1.4); st.kick(5);
      whit(this.weaponId);
      burst(pos, 0xff3b30, 26, 4, 1.0, 0.2);
      burst(pos, 0xffffff, 12, 5, 0.6, 0.14);
      shockwave({ x: this.x, z: this.z });
      if (this.weaponId === 'chainsaw') { st.shake(16); noiseBurst(0.8, 0.5, 500); }
      if (this.weaponId === 'pillow') burst(pos, 0xffffff, 40, 3, 1.6, 0.12, 2);
    }
    else if (n === 'cripple') { st.popup('CRIPPLED!', pos, '#ffb04d', 6); st.shake(6); st.hitstop(0.08); whit(this.weaponId); burst(pos, 0xffb04d, 16, 3); }
    else if (n === 'disarm') { st.popup('DISARMED!', pos, '#9fd8ff', 6); st.hitstop(0.08); this._dropWeapon(); whit(this.weaponId); }
    else if (n === 'stun') { st.popup(this.weaponId === 'pillow' ? 'FEATHERED!' : 'STUNNED!', pos, '#fff3a0', 5); whit(this.weaponId);
      if (this.weaponId === 'pillow') burst(pos, 0xfff6e8, 46, 2.5, 1.8, 0.1, 1.5);
      if (this.weaponId === 'bunny' || this.weaponId === 'chicken') burst(pos, 0xffe08a, 10, 2, 0.6, 0.12);
    }
    else if (n === 'stancebreak') { st.popup('STANCE BROKEN!', pos, '#c8a0ff', 4.5); }
    else if (n === 'break') { st.popup('BAGUETTE BROKE!', pos, '#e8b86e', 5); burst(pos, 0xd8a45e, 20, 3); this._dropWeapon(); }
    else if (n === 'hit' && d.glance) { wswing(this.weaponId); burst(pos, 0xcccccc, 6, 2, 0.4, 0.1); }
  }

  _dropWeapon() {
    if (this.droppedWeapon) return;
    st.scene.remove(this.weaponMesh);
    this.droppedWeapon = this.weaponMesh;
    this.droppedWeapon.position.set(this.x + this.facing * 0.8, 0.1, this.z + 0.4);
    this.droppedWeapon.rotation.set(1.2, 0.4, 1.8);
    st.scene.add(this.droppedWeapon);
  }

  move(dx, dz, speed = 2.6) {
    if (!this.alive) return;
    const sp = this.fighter.crippled ? speed * 0.3 : speed;
    this.vx = dx * sp; this.vz = dz * sp;
  }

  update(dt) {
    const f = this.fighter;
    // integrate movement
    this.x = clamp(this.x + this.vx * dt, -5.2, 5.2);
    this.z = clamp(this.z + this.vz * dt, -2.6, 2.6);
    this.vx *= 0.82; this.vz *= 0.82;
    this.group.position.set(this.x, 0, this.z);
    // walk cycle
    const moving = Math.abs(this.vx) + Math.abs(this.vz) > 0.3;
    if (moving && this.alive) this.walkPh += dt * 10;
    const sw = moving ? Math.sin(this.walkPh) * 0.35 : 0;
    this.parts.legL.rotation.z = sw; this.parts.legR.rotation.z = -sw;
    this.rig.joints.kneeL.rotation.z = -Math.max(0, sw) * 0.9 - 0.06;
    this.rig.joints.kneeR.rotation.z = -Math.max(0, -sw) * 0.9 - 0.06;
    this.parts.armL.rotation.z = -sw * 0.45 + 0.1;
    this.rig.joints.elbowL.rotation.z = 0.45;
    // stance pose + crouch
    const pose = STANCE_POSE[f.stance];
    const crouch = f.crippled ? 0.42 : pose.crouch;
    this.group.position.y = -crouch * 0.55;
    this.parts.torso.rotation.x = pose.lean + crouch * 0.5;
    this.parts.torso.rotation.z = -0.04 + Math.sin(st.t * 2.2 + this.walkPh) * 0.015;
    this.rig.joints.hips.position.y = HIPS_Y - crouch * 0.45;
    if (crouch > 0.05) {
      this.rig.joints.kneeL.rotation.z = -crouch * 1.3;
      this.rig.joints.kneeR.rotation.z = -crouch * 1.3;
    }
    // weapon arm follows weapon dir
    const d = this._weaponDir();
    const ang = Math.atan2(d.y, Math.abs(d.x) * this.facing);
    this.parts.armR.rotation.z = -Math.PI / 2 - ang * 0.9 + (this.facing < 0 ? 0 : 0);
    // face the foe: flip via scale
    this.group.scale.x = this.facing;
    // death fall
    if (!this.alive && this.deadFall < 1) {
      this.deadFall = Math.min(1, this.deadFall + dt * 2.2);
      this.group.rotation.z = this.deadFall * 1.35 * this.facing;
      this.group.position.y = -this.deadFall * 0.5;
    }
    // disarmed stump arm
    if (f.disarmed) this.parts.armR.rotation.z = -0.4;
    // headband tails flutter
    this.parts.tail1.rotation.x = Math.sin(st.t * 6 + this.walkPh) * 0.35;
    this.parts.tail2.rotation.x = Math.sin(st.t * 6 + this.walkPh + 1.3) * 0.45;
    // weapon glows during active frames — reads as "danger" at a glance
    const active = f.inActiveFrames;
    for (const m of this.weaponMats) { m.emissive.setHex(active ? 0xcc7a1a : 0x000000); m.emissiveIntensity = active ? 0.75 : 0; }
    // slash trail arc
    if (f.state === FSTATE.ATTACKING && active) {
      const d = this._weaponDir();
      this.trail.position.set(this.x, 1.0, this.z + 0.35);
      this.trail.rotation.z = Math.atan2(d.y, d.x * this.facing) - Math.PI * 0.4;
      this.trail.material.opacity = Math.min(0.85, this.trail.material.opacity + dt * 10);
    } else {
      this.trail.material.opacity = Math.max(0, this.trail.material.opacity - dt * 7);
    }
    this.trail.visible = this.trail.material.opacity > 0.02;
    f.update();
  }
}

// ---------------------------------------------------------------- AI
class Bot {
  constructor(me, foe, difficulty = 'hard') {
    this.me = me; this.foe = foe;
    this.hard = difficulty === 'hard';
    this.thinkCd = 0; this.plan = 'circle'; this.strafeDir = 1;
    this.feintT = 0;
  }
  update() {
    const me = this.me, foe = this.foe, f = me.fighter;
    if (!me.alive || !foe.alive) return;
    if (this.feintT > 0) { // feint: cancel windup into a stance switch
      this.feintT--;
      if (this.feintT === 0 && f.state === FSTATE.WINDUP) {
        f.state = FSTATE.NEUTRAL; f.frame = 0;
        f.setStance((f.stance + 1 + Math.floor(srand() * 2)) % 3);
      }
      return;
    }
    if (this.thinkCd-- > 0) return;
    this.thinkCd = this.hard ? 6 : 14;
    const dx = foe.x - me.x, dist = Math.abs(dx), dz = foe.z - me.z;
    const reach = me.weapon.reach + 0.55;

    if (f.disarmed) { // run away!
      me.move(-Math.sign(dx) * 1, (Math.random() - 0.5), 3);
      return;
    }
    // punish: foe started windup and we're close -> attack to force clash
    if (foe.fighter.state === FSTATE.WINDUP && dist < reach + 0.6 && srand() < (this.hard ? 0.4 : 0.15)) {
      f.attack(); return;
    }
    // stance mind-games: counter foe stance sometimes, random otherwise
    if (srand() < 0.45) {
      const counter = { [STANCE.HIGH]: STANCE.MID, [STANCE.MID]: STANCE.LOW, [STANCE.LOW]: STANCE.HIGH }[foe.fighter.stance];
      f.setStance(srand() < (this.hard ? 0.6 : 0.3) ? counter : Math.floor(srand() * 3));
    }
    if (dist > reach) {
      me.move(Math.sign(dx) * 1, clamp(dz * 2, -0.6, 0.6) * this.strafeDir);
      if (srand() < 0.1) this.strafeDir *= -1;
    } else {
      const aggro = this.hard ? 0.5 : 0.28;
      const r = srand();
      if (r < aggro) {
        if (srand() < 0.16) { f.attack(); this.feintT = 4; } // feint!
        else f.attack();
      } else if (r < aggro + 0.2) {
        me.move(-Math.sign(dx) * 0.8, 0); // spacing retreat
      } else {
        me.move(0, this.strafeDir * 0.7); // circle strafe
        if (srand() < 0.2) this.strafeDir *= -1;
      }
    }
  }
}

// ---------------------------------------------------------------- game flow
let p1 = null, p2 = null, bot1 = null, bot2 = null;
let mode = 'select';           // select | intro | fight | roundEnd | matchEnd
let modeT = 0, round = 1, wins = [0, 0], roundWinner = -1;
const ROUNDS_TO_WIN = 2, ROUND_TIME = 75;
let roundT = 0, suddenDeath = false;

function pickWeapon(force, foeWeapon) {
  if (force && WEAPONS[force]) return force;
  // viral default: never mirror boring — ensure at least one crazy weapon in spectate
  let w = spick(WEAPON_IDS);
  if (foeWeapon && w === foeWeapon && srand() < 0.7) w = spick(WEAPON_IDS);
  return w;
}

function startDuel(w1, w2) {
  if (p1) { st.scene.remove(p1.group); if (p1.droppedWeapon) st.scene.remove(p1.droppedWeapon); }
  if (p2) { st.scene.remove(p2.group); if (p2.droppedWeapon) st.scene.remove(p2.droppedWeapon); }
  p1 = new Duelist('YOU', 0x4a6de0, 1, w1, SPECTATE || AUTOSTART);
  p2 = new Duelist('FOE', 0xe04a4a, -1, w2, true);
  p1.x = -2.2; p2.x = 2.2; p1.z = 0; p2.z = 0;
  bot1 = new Bot(p1, p2, BOTS); bot2 = new Bot(p2, p1, BOTS);
  round = 1; wins = [0, 0]; roundT = 0; suddenDeath = false;
  mode = 'intro'; modeT = 0;
  st.hud.banner(`ROUND 1`, 1.4);
  setTimeout(() => { if (mode === 'intro') { st.hud.banner('FIGHT!', 0.8); tone(220, 0.3, 'square', 0.3); } }, 900);
  setTimeout(() => { if (mode === 'intro') { mode = 'fight'; modeT = 0; } }, 1500);
}

function endRound(winner) { // 0 = p1, 1 = p2, -1 = draw
  if (mode !== 'fight') return;
  roundWinner = winner;
  if (winner >= 0) wins[winner]++;
  mode = 'roundEnd'; modeT = 0;
  const done = wins[0] >= ROUNDS_TO_WIN || wins[1] >= ROUNDS_TO_WIN;
  setTimeout(() => {
    if (done) {
      mode = 'matchEnd';
      const youWon = wins[0] > wins[1];
      st.end({ win: youWon && !SPECTATE, score: wins[0] * 1000 + (ROUNDS_TO_WIN - wins[1]) * 250, label: 'DUELS WON' });
      st.hud.banner(youWon ? (SPECTATE ? 'BLUE WINS' : 'YOU WIN') : 'FOE WINS', 3);
    } else {
      round++;
      // reset fighters, keep weapons
      for (const [d, x] of [[p1, -2.2], [p2, 2.2]]) {
        const w = d.weaponId;
        st.scene.remove(d.group); if (d.droppedWeapon) st.scene.remove(d.droppedWeapon);
      }
      const w1 = p1.weaponId, w2 = p2.weaponId;
      p1 = new Duelist('YOU', 0x4a6de0, 1, w1, SPECTATE || AUTOSTART);
      p2 = new Duelist('FOE', 0xe04a4a, -1, w2, true);
      p1.x = -2.2; p2.x = 2.2;
      bot1 = new Bot(p1, p2, BOTS); bot2 = new Bot(p2, p1, BOTS);
      roundT = 0; suddenDeath = false;
      mode = 'intro'; modeT = 0;
      st.hud.banner(`ROUND ${round}`, 1.2);
      setTimeout(() => { if (mode === 'intro') { mode = 'fight'; modeT = 0; st.hud.banner('FIGHT!', 0.7); } }, 1200);
    }
  }, 2200);
}

// weapon select UI
const wsel = document.getElementById('wselect'), wgrid = document.getElementById('wgrid');
if (!AUTOSTART && !CLEAN) {
  wsel.style.display = 'flex';
  for (const id of WEAPON_IDS) {
    const w = WEAPONS[id];
    const card = document.createElement('div');
    card.className = 'wcard';
    card.innerHTML = `<div class="emo">${WEAPON_EMOJI[id]}</div><div class="nm">${w.name.toUpperCase()}</div><div class="bl">${w.blurb}</div>`;
    card.onclick = () => { wsel.style.display = 'none'; if (IS_TOUCH && !CLEAN && !SPECTATE) tc.show(); startDuel(id, pickWeapon(null, id)); };
    wgrid.appendChild(card);
  }
} else {
  // autostart / spectate: straight to the duel
  const w1 = pickWeapon(FORCE_W1), w2 = pickWeapon(FORCE_W2, w1);
  startDuel(w1, w2);
}
// (touch input is handled by TouchController in the main loop below)

// ---------------------------------------------------------------- camera
const camTarget = new THREE.Vector3(0, 1.2, 0), camPos = new THREE.Vector3(0, 2.9, 7.0);
let orbitA = 0;
function tickCamera(dt) {
  if (!p1 || !p2) return;
  const mid = { x: (p1.x + p2.x) / 2, y: 1.1, z: (p1.z + p2.z) / 2 };
  if (SPECTATE) {
    if (mode === 'fight') {
      // chase cam: behind whoever is attacking, else gentle side track
      const att = p1.fighter.inActiveFrames ? p1 : p2.fighter.inActiveFrames ? p2 : null;
      const focus = att || (Math.abs(p1.x - p2.x) < 2 ? p1 : null);
      if (att) {
        const bx = att.x - att.facing * 4.2, bz = att.z + 3.9;
        camPos.x += (bx - camPos.x) * Math.min(1, dt * 3);
        camPos.y += (2.4 - camPos.y) * Math.min(1, dt * 3);
        camPos.z += (bz - camPos.z) * Math.min(1, dt * 3);
      } else {
        camPos.x += (mid.x * 0.6 - camPos.x) * Math.min(1, dt * 1.5);
        camPos.y += (2.9 - camPos.y) * Math.min(1, dt * 1.5);
        camPos.z += (7.0 - camPos.z) * Math.min(1, dt * 1.5);
      }
      camTarget.x += (mid.x - camTarget.x) * Math.min(1, dt * 4);
      camTarget.y += (mid.y - camTarget.y) * Math.min(1, dt * 4);
      camTarget.z += (mid.z - camTarget.z) * Math.min(1, dt * 4);
    } else {
      // slow orbit between rounds
      orbitA += dt * 0.25;
      camPos.set(Math.sin(orbitA) * 8.5, 3.4 + Math.sin(orbitA * 0.6) * 0.8, Math.cos(orbitA) * 8.5);
      camTarget.set(0, 1.2, 0);
    }
  } else {
    // portrait phones: pull in closer so fighters fill the frame
    const portrait = st.camera.aspect < 1;
    const dz = portrait ? 4.8 : 7.0, dy = portrait ? 2.3 : 2.9;
    camPos.x += (mid.x * 0.55 - camPos.x) * Math.min(1, dt * 2.5);
    camPos.y += (dy - camPos.y) * Math.min(1, dt * 2.5);
    camPos.z += (dz - camPos.z) * Math.min(1, dt * 2.5);
    camTarget.set(mid.x * 0.8, 1.15, mid.z * 0.5);
  }
  st.camera.position.copy(camPos);
  st.camera.lookAt(camTarget);
}

// ---------------------------------------------------------------- HUD
function tickHud() {
  if (!p1 || !p2 || CLEAN) return;
  const stanceTag = s => ['HIGH ↑', 'MID →', 'LOW ↓'][s];
  const f1 = p1.fighter, f2 = p2.fighter;
  const w1 = `${WEAPON_EMOJI[p1.weaponId]} ${p1.weapon.name}`;
  const w2 = `${p2.weapon.name} ${WEAPON_EMOJI[p2.weaponId]}`;
  st.hud.left(`<div style="color:#9fb8ff">${SPECTATE ? 'BLUE' : 'YOU'} · ${w1}</div><div style="font-size:3.4vmin">${stanceTag(f1.stance)}${f1.crippled ? ' · CRIPPLED' : ''}${f1.disarmed ? ' · DISARMED' : ''}</div><div style="font-size:6vmin;color:#ffd34d">${'●'.repeat(wins[0])}${'○'.repeat(ROUNDS_TO_WIN - wins[0])}</div>`);
  st.hud.right(`<div style="color:#ffb0a0">FOE · ${w2}</div><div style="font-size:3.4vmin">${stanceTag(f2.stance)}${f2.crippled ? ' · CRIPPLED' : ''}${f2.disarmed ? ' · DISARMED' : ''}</div><div style="font-size:6vmin;color:#ffd34d">${'●'.repeat(wins[1])}${'○'.repeat(ROUNDS_TO_WIN - wins[1])}</div>`);
  if (mode === 'fight' && !SPECTATE) st.hud.hint(tc.enabled ? 'LEFT THUMB move · ⚔ attack · STANCE cycles H/M/L' : 'A/D move · 1/2/3 stance · SPACE attack · M mute');
}

// ---------------------------------------------------------------- main loop
st.run(dt => {
  tickPetals(dt);
  sparks.update(dt);
  tickShockwaves(dt);
  if (!p1 || !p2) return;

  if (mode === 'fight') {
    roundT += dt;
    // player input (or bot in spectate/autostart)
    if (p1.isBot) bot1.update(); else {
      const k = st.keys;
      let mx = 0, mz = 0;
      if (k['a'] || k['arrowleft']) mx -= 1;
      if (k['d'] || k['arrowright']) mx += 1;
      if (k['w'] || k['arrowup']) mz -= 1;
      if (k['s'] || k['arrowdown']) mz += 1;
      let touchAttack = false, touchStance = false;
      if (tc.enabled) {
        const vx = tc.vector.x, vy = tc.vector.y;
        if (Math.hypot(vx, vy) > 0.12) { mx = vx; mz = vy; } // floating joystick (analog)
        touchAttack = tc.takeA(); touchStance = tc.takeB();
        tc.setStanceLabel(['H', 'M', 'L'][p1.fighter.stance]);
      }
      p1.move(mx, mz, 3.0);
      if (k['1']) p1.fighter.setStance(STANCE.HIGH);
      if (k['2']) p1.fighter.setStance(STANCE.MID);
      if (k['3']) p1.fighter.setStance(STANCE.LOW);
      if (touchStance) p1.fighter.setStance((p1.fighter.stance + 1) % 3); // STANCE button cycles
      if (k[' '] || k['j'] || touchAttack) { if (p1.fighter.attack()) { k[' '] = false; k['j'] = false; } }
    }
    bot2.update();

    // combat resolution, both directions
    for (const [att, def] of [[p1, p2], [p2, p1]]) {
      const r = resolveExchange(att.fighter, def.fighter);
      if (r && r.type === 'clash') {
        st.hitstop(0.09); st.shake(6); st.kick(3); clashSfx();
        burst(r.point, 0xffe08a, 22, 4.5, 0.5, 0.14);
        burst(r.point, 0xffffff, 10, 2.5, 0.35, 0.1);
        st.popup('CLASH!', r.point, '#ffe08a', 5.5);
      } else if (r && r.type === 'hit') {
        // knockback on glance
        if (r.outcome === 'glance') {
          const kb = att.weapon.knockback;
          def.x = clamp(def.x + att.facing * 0.5 * kb, -5.2, 5.2);
        }
      }
    }

    // round end conditions
    if (!p1.alive || !p2.alive) endRound(!p1.alive && !p2.alive ? -1 : (!p1.alive ? 1 : 0));
    else if (roundT > ROUND_TIME) endRound(wins[0] === wins[1] ? -1 : (wins[0] > wins[1] ? 0 : 1));
  }

  p1.update(dt); p2.update(dt);
  tickCamera(dt);
  tickHud();

  // drive/test harness
  window.__game = {
    mode, round, wins: [...wins], roundT: +roundT.toFixed(1),
    p1: { weapon: p1.weaponId, stance: STANCE_NAMES[p1.fighter.stance], state: p1.fighter.state, alive: p1.alive, x: +p1.x.toFixed(2), crippled: p1.fighter.crippled, disarmed: p1.fighter.disarmed },
    p2: { weapon: p2.weaponId, stance: STANCE_NAMES[p2.fighter.stance], state: p2.fighter.state, alive: p2.alive, x: +p2.x.toFixed(2), crippled: p2.fighter.crippled, disarmed: p2.fighter.disarmed },
    spectate: SPECTATE, frame: (window.__game?.frame || 0) + 1,
  };
  window.__events = window.__events || [];
});
</script>
