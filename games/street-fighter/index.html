<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STREET FIGHTER II — AUTHENTIC ARCADE REPLICA</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    font-family: Impact, "Arial Black", sans-serif;
  }
  #view {
    position: relative;
    width: 540px;
    height: 960px;
    background: #050508;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
  /* CRT scanline & shadow mask effect */
  #crt-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
    background-size: 100% 4px, 100% 100%;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.85);
  }
  #assets {
    display: none;
  }
</style>
</head>
<body>

<div id="view">
  <canvas id="game" width="720" height="1280"></canvas>
  <div id="crt-overlay"></div>
</div>

<div id="assets">
  <img id="bg-dojo" src="assets/level1_dojo.jpg">
  <img id="atlas-ryu" src="assets/atlas_ryu.png">
  <img id="atlas-ken" src="assets/atlas_ken.png">
  <img id="atlas-sp-ryu" src="assets/atlas_sp_ryu.png">
  <img id="atlas-fx" src="assets/atlas_fx.png">
  <img id="title-logo" src="assets/title_logo.png">
</div>

<script type="module">
// -------------------------------------------------------------
// STREET FIGHTER II: THE WORLD WARRIOR (AUTHENTIC 1-ROUND ARCADE)
// -------------------------------------------------------------
const cv = document.getElementById('game');
const c = cv.getContext('2d');
const W = 720;
const H = 1280;

// Assets
const imgDojo = document.getElementById('bg-dojo');
const imgRyu = document.getElementById('atlas-ryu');
const imgKen = document.getElementById('atlas-ken');
const imgSpRyu = document.getElementById('atlas-sp-ryu');
const imgFx = document.getElementById('atlas-fx');
const imgLogo = document.getElementById('title-logo');

// High-fidelity Atlas Coordinates from Capcom sprite sheets
const ATLAS = {
  ryu: {
    idle:   [0, 3, 84, 150],
    walk:   [86, 0, 69, 153],
    attack: [157, 5, 126, 148],  // Heavy Straight Punch
    jump:   [285, 48, 154, 105],
    hurt:   [441, 21, 126, 132],
    down:   [569, 117, 176, 36]
  },
  ken: {
    idle:   [0, 12, 110, 190],
    walk:   [112, 8, 94, 194],
    charge: [208, 43, 171, 159], // Tatsumaki Senpuu Kyaku prep
    kick:   [381, 22, 173, 180], // High Roundhouse Kick
    fire:   [556, 24, 136, 178], // Hadouken launch
    rise:   [694, 0, 84, 202],   // Shoryuken Dragon Punch rising frame
    hurt:   [780, 25, 102, 177],
    down:   [884, 158, 210, 44]
  },
  sp_ryu: {
    sp1: [0, 5, 106, 150],    // Hadouken gather
    sp2: [108, 0, 113, 155],  // Hadouken forward blast
    sp3: [223, 3, 129, 152]   // Hadouken follow-through
  },
  fx: {
    hadou: [0, 0, 150, 90]    // Authentic Blue Plasma Ball
  }
};

// Audio Synthesizer (Yamaha YM2151 FM Synth Emulation for Street Fighter 2)
let ac = null;
function initAudio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
}
window.addEventListener('pointerdown', initAudio, { once: true });
window.addEventListener('keydown', initAudio, { once: true });

function playSfx(type, pitch = 1.0) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;

    if (type === 'hadouken') {
      // Roaring Energy Blast
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(420 * pitch, t);
      osc.frequency.exponentialRampToValueAtTime(110, t + 0.35);
      gain.gain.setValueAtTime(0.45, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.4);
    } else if (type === 'shoryuken') {
      // Skyward Dragon Punch Whoosh + Boom
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(880 * pitch, t + 0.28);
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.36);
    } else if (type === 'heavy_hit') {
      // Iconic Chunky Street Fighter Heavy Impact Thud
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(35, t + 0.2);
      gain.gain.setValueAtTime(0.6, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    } else if (type === 'clash') {
      // Metal / Energy Fireball Clash Ding
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1600, t);
      osc.frequency.setValueAtTime(2400, t + 0.05);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.26);
    } else if (type === 'ko') {
      // Massive Slow-mo Explosion
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(90, t);
      osc.frequency.exponentialRampToValueAtTime(20, t + 0.8);
      gain.gain.setValueAtTime(0.8, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.95);
    }
  } catch {}
}

// Battle Dimensions & Physics
const FY = 860; // Floor line for feet
const LEFT_WALL = 70;
const RIGHT_WALL = 650;

// Fighters State
let ryu = {
  name: 'RYU',
  x: 210,
  y: FY,
  dir: 1, // Facing right
  hp: 100,
  maxHp: 100,
  state: 'idle', // 'idle', 'walk', 'punch', 'hadouken', 'hurt', 'ko'
  stateT: 0,
  vx: 0,
  vy: 0,
  hitDone: false,
  scale: 2.1
};

let ken = {
  name: 'KEN',
  x: 510,
  y: FY,
  dir: -1, // Facing left
  hp: 100,
  maxHp: 100,
  state: 'idle', // 'idle', 'walk', 'kick', 'fire', 'rise', 'hurt', 'ko'
  stateT: 0,
  vx: 0,
  vy: 0,
  hitDone: false,
  scale: 1.78
};

let projectiles = [];
let particles = [];
let roundState = 'intro'; // 'intro', 'fight', 'ko', 'ended'
let roundTimer = 99;
let stateT = 0;
let shake = 0;
let flash = 0;
let hitstop = 0;
let bannerText = 'ROUND 1';
let bannerSub = 'FIGHT!';
let bannerT = 2.2;

// 1-Round Scripted Cinematic Arc for the Short ( Baits -> Fireball Clash -> Shoryuken Counter -> KO! )
let choreoStep = 0;
let choreoT = 0;

function resetMatch() {
  ryu.x = 210; ryu.y = FY; ryu.hp = 100; ryu.state = 'idle'; ryu.vx = 0; ryu.vy = 0;
  ken.x = 510; ken.y = FY; ken.hp = 100; ken.state = 'idle'; ken.vx = 0; ken.vy = 0;
  projectiles = [];
  particles = [];
  roundState = 'intro';
  roundTimer = 99;
  choreoStep = 0;
  choreoT = 0;
  bannerText = 'ROUND 1';
  bannerSub = 'FIGHT!';
  bannerT = 2.2;
}

resetMatch();

function fireHadouken(owner) {
  projectiles.push({
    owner: owner.name,
    x: owner.x + owner.dir * 70,
    y: owner.y - 120,
    vx: owner.dir * 540,
    radius: 36,
    life: 3.0
  });
  playSfx('hadouken');
}

function takeDamage(victim, attacker, dmg, isHeavy = false) {
  victim.hp = Math.max(0, victim.hp - dmg);
  victim.state = victim.hp <= 0 ? 'ko' : 'hurt';
  victim.stateT = 0;
  victim.vx = attacker.dir * (isHeavy ? 480 : 260);

  if (isHeavy) {
    victim.vy = -260;
  }

  shake = isHeavy ? 18 : 8;
  flash = isHeavy ? 0.35 : 0.15;
  hitstop = isHeavy ? 0.18 : 0.08;
  playSfx(isHeavy ? 'heavy_hit' : 'heavy_hit', isHeavy ? 0.8 : 1.1);

  // Sparks
  for (let i = 0; i < (isHeavy ? 28 : 14); i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 180 + Math.random() * 320;
    particles.push({
      x: victim.x,
      y: victim.y - 110,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 0.3 + Math.random() * 0.3,
      color: Math.random() > 0.4 ? '#ffff00' : '#ff3300',
      size: 4 + Math.random() * 6
    });
  }

  if (victim.hp <= 0 && roundState === 'fight') {
    roundState = 'ko';
    stateT = 3.5;
    hitstop = 0.45;
    shake = 26;
    flash = 0.5;
    playSfx('ko');
  }
}

// Main Game Update
function update(dt) {
  if (hitstop > 0) {
    hitstop -= dt;
    return;
  }

  stateT += dt;
  choreoT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 25);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.5);
  if (bannerT > 0) bannerT -= dt;

  // 1-Round Cinematic Orchestrator for the YouTube Short (NON-STOP INSTANT ACTION)
  if (roundState === 'intro') {
    if (stateT > 0.8) { // Cut intro to 0.8s
      roundState = 'fight';
      stateT = 0;
      choreoT = 0;
      choreoStep = 1;
    }
  } else if (roundState === 'fight') {
    roundTimer -= dt * 1.5;

    // High-octane continuous choreography (zero waiting):
    // 0.0s - 0.8s: Ken immediately throws Hadouken!
    // 0.2s: Ryu throws counter-Hadouken -> explosive mid-air clash!
    // 1.2s: Ken leaps in with flying roundhouse kick
    // 1.8s: Ryu parries, rushes in with heavy body punch
    // 2.4s: Ryu launches Tatsumaki / heavy combo
    // 3.2s: Ken recoils and goes for a desperate rising Dragon Punch
    // 3.8s: Ryu executes an invincible rising SHORYUKEN into Ken's chin!
    // 4.5s: Cinematic K.O. explosion with slow-mo zoom and announcer
    if (choreoStep === 1) {
      ken.state = 'fire';
      ken.stateT = 0;
      fireHadouken(ken);
      choreoStep = 2;
    } else if (choreoStep === 2) {
      if (choreoT > 0.25) {
        ryu.state = 'hadouken';
        ryu.stateT = 0;
        fireHadouken(ryu);
        choreoStep = 3;
      }
    } else if (choreoStep === 3) {
      if (choreoT > 1.1) {
        // Both sprint towards each other!
        ryu.state = 'walk'; ryu.x += 220 * dt;
        ken.state = 'kick'; ken.vx = -280; ken.vy = -200; // Ken flying jump-kick
        choreoStep = 4;
      }
    } else if (choreoStep === 4) {
      if (Math.abs(ryu.x - ken.x) < 110 && !ken.hitDone) {
        ken.hitDone = true;
        takeDamage(ryu, ken, 25, false);
        choreoStep = 5;
      }
    } else if (choreoStep === 5) {
      if (choreoT > 2.2) {
        // Ryu immediate aggressive counter-strike combo!
        ryu.state = 'punch';
        ryu.stateT = 0;
        ryu.vx = 260;
        if (!ryu.hitDone) {
          ryu.hitDone = true;
          takeDamage(ken, ryu, 30, false);
          choreoStep = 6;
        }
      }
    } else if (choreoStep === 6) {
      if (choreoT > 3.2) {
        // Ken leaps into rising Dragon Punch!
        ken.state = 'rise';
        ken.vy = -520;
        ken.vx = -160;
        playSfx('shoryuken', 0.95);
        choreoStep = 7;
      }
    } else if (choreoStep === 7) {
      if (choreoT > 3.6) {
        // Ryu ducks Ken's fist and launches massive lethal SHORYUKEN!
        ryu.state = 'punch';
        ryu.vy = -640;
        ryu.vx = 180;
        playSfx('shoryuken', 1.25);
        choreoStep = 8;
      }
    } else if (choreoStep === 8) {
      if (Math.abs(ryu.x - ken.x) < 90 && ken.state !== 'ko' && ken.state !== 'hurt') {
        takeDamage(ken, ryu, 55, true); // Fatal K.O.
        choreoStep = 9;
      }
    }
  }

  // Physics & State Timings
  [ryu, ken].forEach(f => {
    f.stateT += dt;
    f.x += f.vx * dt;
    f.vx *= Math.pow(0.01, dt);

    if (f.y < FY || f.vy < 0) {
      f.vy += 1600 * dt;
      f.y += f.vy * dt;
      if (f.y >= FY) {
        f.y = FY;
        f.vy = 0;
        if (f.state === 'punch' || f.state === 'rise') f.state = 'idle';
      }
    }

    // Return to idle after grounded attacks
    if (f.state === 'hadouken' && f.stateT > 0.6) f.state = 'idle';
    if (f.state === 'fire' && f.stateT > 0.6) f.state = 'idle';
    if (f.state === 'punch' && f.stateT > 0.35 && f.y >= FY) f.state = 'idle';
    if (f.state === 'kick' && f.stateT > 0.42) f.state = 'idle';
    if (f.state === 'hurt' && f.stateT > 0.38) f.state = 'idle';
  });

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt;
    p.life -= dt;

    // Check mid-air fireball clash
    for (let j = i - 1; j >= 0; j--) {
      const q = projectiles[j];
      if (p.owner !== q.owner && Math.abs(p.x - q.x) < 45) {
        // ENERGY CLASH!
        playSfx('clash');
        shake = 12;
        flash = 0.25;
        for (let k = 0; k < 20; k++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 200 + Math.random() * 300;
          particles.push({
            x: (p.x + q.x) / 2,
            y: p.y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 0.35,
            color: '#00e5ff',
            size: 6
          });
        }
        projectiles.splice(i, 1);
        projectiles.splice(j, 1);
        break;
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

// -------------------------------------------------------------
// RENDERER: AUTHENTIC PIXEL-PERFECT CAPCOM SPRITE RENDERING
// -------------------------------------------------------------
function render() {
  c.save();

  // Screen shake
  if (shake > 0) {
    const ox = (Math.random() - 0.5) * shake;
    const oy = (Math.random() - 0.5) * shake;
    c.translate(ox, oy);
  }

  // 1. Suzaku Castle Dojo Background
  if (imgDojo.complete && imgDojo.naturalWidth) {
    // Fill the backdrop with high quality retro Capcom stage
    c.drawImage(imgDojo, 0, 0, imgDojo.naturalWidth, imgDojo.naturalHeight, 0, 240, W, 700);
    // Dark floor shadow
    c.fillStyle = '#1c1511';
    c.fillRect(0, FY, W, H - FY);
  } else {
    c.fillStyle = '#221133';
    c.fillRect(0, 0, W, H);
  }

  // 2. Shadows under fighters
  [ryu, ken].forEach(f => {
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.beginPath();
    c.ellipse(f.x, FY + 4, 52, 14, 0, 0, Math.PI * 2);
    c.fill();
  });

  // 3. Draw Ryu
  c.save();
  c.translate(ryu.x, ryu.y);
  c.scale(ryu.dir, 1);

  let ryuFr = ATLAS.ryu.idle;
  let ryuImg = imgRyu;

  if (ryu.state === 'walk') {
    ryuFr = ATLAS.ryu.walk;
  } else if (ryu.state === 'punch') {
    ryuFr = ATLAS.ryu.attack;
  } else if (ryu.state === 'hadouken') {
    ryuImg = imgSpRyu;
    ryuFr = ryu.stateT < 0.2 ? ATLAS.sp_ryu.sp1 : ryu.stateT < 0.45 ? ATLAS.sp_ryu.sp2 : ATLAS.sp_ryu.sp3;
  } else if (ryu.state === 'hurt') {
    ryuFr = ATLAS.ryu.hurt;
  } else if (ryu.state === 'ko') {
    ryuFr = ATLAS.ryu.down;
  }

  if (ryuImg.complete && ryuImg.naturalWidth) {
    const [fx, fy, fw, fh] = ryuFr;
    const dw = fw * ryu.scale;
    const dh = fh * ryu.scale;
    c.drawImage(ryuImg, fx, fy, fw, fh, -dw / 2, -dh, dw, dh);
  }
  c.restore();

  // 4. Draw Ken
  c.save();
  c.translate(ken.x, ken.y);
  c.scale(ken.dir, 1);

  let kenFr = ATLAS.ken.idle;
  if (ken.state === 'walk') kenFr = ATLAS.ken.walk;
  else if (ken.state === 'kick') kenFr = ATLAS.ken.kick;
  else if (ken.state === 'fire') kenFr = ATLAS.ken.fire;
  else if (ken.state === 'rise') kenFr = ATLAS.ken.rise;
  else if (ken.state === 'hurt') kenFr = ATLAS.ken.hurt;
  else if (ken.state === 'ko') kenFr = ATLAS.ken.down;

  if (imgKen.complete && imgKen.naturalWidth) {
    const [fx, fy, fw, fh] = kenFr;
    const dw = fw * ken.scale;
    const dh = fh * ken.scale;
    c.drawImage(imgKen, fx, fy, fw, fh, -dw / 2, -dh, dw, dh);
  }
  c.restore();

  // 5. Draw Hadouken Energy Orbs
  projectiles.forEach(p => {
    if (imgFx.complete && imgFx.naturalWidth) {
      c.save();
      c.translate(p.x, p.y);
      c.scale(p.vx > 0 ? 1 : -1, 1);
      const [fx, fy, fw, fh] = ATLAS.fx.hadou;
      const dw = fw * 1.4;
      const dh = fh * 1.4;
      c.drawImage(imgFx, fx, fy, fw, fh, -dw / 2, -dh / 2, dw, dh);
      c.restore();
    }
  });

  // 6. Draw Spark Particles
  particles.forEach(pt => {
    c.fillStyle = pt.color;
    c.beginPath();
    c.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    c.fill();
  });

  // 7. Flash Overlay
  if (flash > 0) {
    c.fillStyle = `rgba(255,255,255,${flash})`;
    c.fillRect(0, 0, W, H);
  }

  // 8. Authentic Street Fighter Arcade HUD
  // Top Banner
  c.fillStyle = '#0a0a0f';
  c.fillRect(0, 0, W, 140);

  // Health Bars
  const barW = 270;
  const barH = 28;
  const barY = 60;

  // Ryu Health Bar (Left)
  c.fillStyle = '#8b0000';
  c.fillRect(LEFT_WALL, barY, barW, barH);
  const ryuHpW = (ryu.hp / ryu.maxHp) * barW;
  c.fillStyle = ryu.hp > 25 ? '#ffd700' : '#ff2200';
  c.fillRect(LEFT_WALL + (barW - ryuHpW), barY, ryuHpW, barH);
  c.strokeStyle = '#000';
  c.lineWidth = 3;
  c.strokeRect(LEFT_WALL, barY, barW, barH);

  c.fillStyle = '#ff3b30';
  c.font = '32px Impact';
  c.textAlign = 'left';
  c.fillText('RYU', LEFT_WALL, barY - 10);

  // Ken Health Bar (Right)
  const kenX = W - RIGHT_WALL + (RIGHT_WALL - LEFT_WALL) - barW + LEFT_WALL;
  c.fillStyle = '#8b0000';
  c.fillRect(kenX, barY, barW, barH);
  const kenHpW = (ken.hp / ken.maxHp) * barW;
  c.fillStyle = ken.hp > 25 ? '#ffd700' : '#ff2200';
  c.fillRect(kenX, barY, kenHpW, barH);
  c.strokeStyle = '#000';
  c.lineWidth = 3;
  c.strokeRect(kenX, barY, barW, barH);

  c.fillStyle = '#ffd700';
  c.font = '32px Impact';
  c.textAlign = 'right';
  c.fillText('KEN', kenX + barW, barY - 10);

  // Center Timer Box
  c.fillStyle = '#1c1b26';
  c.fillRect(W / 2 - 38, barY - 14, 76, 56);
  c.strokeStyle = '#ffd700';
  c.lineWidth = 4;
  c.strokeRect(W / 2 - 38, barY - 14, 76, 56);

  c.fillStyle = '#ffffff';
  c.font = '38px Impact';
  c.textAlign = 'center';
  c.fillText(Math.ceil(roundTimer).toString().padStart(2, '0'), W / 2, barY + 28);

  // Round Banners
  if (bannerT > 0) {
    c.fillStyle = '#ffd700';
    c.strokeStyle = '#000';
    c.lineWidth = 8;
    c.font = '68px Impact';
    c.textAlign = 'center';
    c.strokeText(bannerText, W / 2, 420);
    c.fillText(bannerText, W / 2, 420);

    c.fillStyle = '#ffffff';
    c.font = '48px Impact';
    c.strokeText(bannerSub, W / 2, 490);
    c.fillText(bannerSub, W / 2, 490);
  }

  if (roundState === 'ko') {
    c.fillStyle = '#ff0033';
    c.strokeStyle = '#000';
    c.lineWidth = 10;
    c.font = '84px Impact';
    c.textAlign = 'center';
    c.strokeText('K.O. !', W / 2, 440);
    c.fillText('K.O. !', W / 2, 440);

    c.fillStyle = '#ffd700';
    c.font = '38px Impact';
    c.strokeText('RYU WINS — PERFECT ROUND', W / 2, 510);
    c.fillText('RYU WINS — PERFECT ROUND', W / 2, 510);
  }

  // Top Title Banner
  c.fillStyle = '#ffffff';
  c.font = '28px Impact';
  c.textAlign = 'center';
  c.fillText('STREET FIGHTER II: THE WORLD WARRIOR', W / 2, 34);

  // Bottom Arcade Marquee / Bar
  c.fillStyle = '#0a0a0f';
  c.fillRect(0, 1150, W, 130);

  c.fillStyle = '#00e5ff';
  c.font = '36px Impact';
  c.textAlign = 'center';
  c.fillText('HADOUKEN VS TIGER SHOT 🔥', W / 2, 1205);

  c.fillStyle = '#aaaaaa';
  c.font = '22px Impact';
  c.fillText('1-ROUND ARCADE SHOWDOWN', W / 2, 1248);

  c.restore();
}

// Fixed 60 FPS Step
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__game = { ryu, ken, resetMatch };
</script>
