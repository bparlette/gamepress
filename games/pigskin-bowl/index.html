<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pigskin Bowl</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#1a5c2a}canvas{display:block}</style></head><body>
<script type="module">
// Pigskin Bowl: YOU are the fat running back. 1000 skinny defenders run at you.
// Bowl through them — knocked defenders fly and domino into others. +1 per pancake,
// chain bonuses, +7 for the touchdown. Next drive: faster, meaner.
import { createStage, sfx, rand, clamp, THREE } from '../../kit/gp3d.js';
import { toon, crowd, hero, particles, sky, groundTex, blobs, build, walkClock } from '../../kit/gpkit.js';

const FIELD_W = 36, FIELD_L = 120, EZ = 10, N_DEF = 1000;
const st = createStage({ bg: 0x87b5e8, fitWidth: 14 });
st.light(); sky(st.scene, 0x4a8cff, 0xcfe8ff, [50, 160]);

// ---- field ----
const grass = new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W + 12, FIELD_L + EZ * 2 + 8),
  toon(0x3f9e4d, { map: groundTex('grass', 60) }));
grass.rotation.x = -Math.PI / 2; grass.position.z = FIELD_L / 2; st.scene.add(grass);
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
for (let y = 0; y <= 100; y += 10) {
  const w = new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W, .35), lineMat);
  w.rotation.x = -Math.PI / 2; w.position.set(0, .02, EZ + y); st.scene.add(w);
}
for (const ez of [0, 1]) {
  const zone = new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W, EZ), new THREE.MeshBasicMaterial({ color: 0xc23b2e }));
  zone.rotation.x = -Math.PI / 2; zone.position.set(0, .015, ez ? FIELD_L + EZ / 2 : EZ / 2); st.scene.add(zone);
}

// ---- player: THE FAT RUNNING BACK ----
const fatGeo = build([
  { g: 'sphere', s: [2.7, 2.1, 2.2], p: [0, 1.05, 0], c: 0x8b4513 },   // big round belly, brown jersey
  { g: 'sphere', s: [.9, .9, .9], p: [0, 2.45, .35], c: 0xd9a066 },     // head
  { g: 'sphere', s: [1.0, .7, .6], p: [0, 2.5, .3], c: 0xeeeeee },      // helmet
  { g: 'sphere', s: [.5, .9, .5], p: [-1.5, 1.0, 0], c: 0x8b4513 },     // arms
  { g: 'sphere', s: [.5, .9, .5], p: [1.5, 1.0, 0], c: 0x8b4513 },
  { g: 'sphere', s: [.55, .8, .55], p: [-.6, .35, 0], c: 0x5a2d0c },    // legs
  { g: 'sphere', s: [.55, .8, .55], p: [.6, .35, 0], c: 0x5a2d0c },
]);
const player = hero(fatGeo, 0xffffff, .04);
player.position.set(0, 0, EZ + 4); st.scene.add(player);
const pShadow = blobs(st.scene, 1);

// ---- defenders: 1000 skinny, instanced (vertex-colored white so instance tints show) ----
const skinnyGeo = build([
  { g: 'cyl', s: [.55, 1.9, .55], p: [0, 1.0, 0], c: 0xffffff },
  { g: 'sphere', s: [.5, .5, .5], p: [0, 2.15, 0], c: 0xffffff },
]);
const defs = crowd(st.scene, skinnyGeo, N_DEF, true, 0);
const DX = new Float32Array(N_DEF), DZ = new Float32Array(N_DEF);
const DVX = new Float32Array(N_DEF), DVZ = new Float32Array(N_DEF);
const TUMBLE = new Float32Array(N_DEF);
const DST = new Uint8Array(N_DEF);   // 0 hidden, 1 running, 2 flying, 3 down
const jersey = [0x2244cc, 0xcc2222, 0x22aa44, 0xccaa22];
for (let i = 0; i < N_DEF; i++) defs.color(i, jersey[i % 4]);

// ---- spatial grid for domino collisions ----
const CELL = 3, COLS = 14, ROWS = 50, Z0 = -10;
const grid = new Array(COLS * ROWS);
for (let i = 0; i < grid.length; i++) grid[i] = [];
const gcell = (x, z) => {
  const c = clamp(((x + FIELD_W / 2 + 2) / CELL) | 0, 0, COLS - 1);
  const r = clamp(((z - Z0) / CELL) | 0, 0, ROWS - 1);
  return r * COLS + c;
};

const fx = particles(st.scene, 600);
let score = 0, drive = 1, chain = 0, chainT = 0;
let px = 0, pz = EZ + 4, pvx = 0, speed = 9;
let spawned = 0, down = 0, shake = 0, steer = 0, touching = false, touchX = 0;

function spawnAll() {
  spawned = 0; down = 0;
  for (let k = 0; k < N_DEF; k++) {
    const i = spawned++;
    DX[i] = (rand() - .5) * (FIELD_W - 4);
    DZ[i] = EZ + 15 + rand() * (FIELD_L - 25);
    DVX[i] = 0; DVZ[i] = 0; TUMBLE[i] = 0; DST[i] = 1;
  }
}
function reset(d) {
  px = 0; pz = EZ + 4; pvx = 0; chain = 0; chainT = 0;
  speed = 8 + d * 1.2;
  spawnAll();
}

function knockdown(i, vx, vz) {
  if (DST[i] !== 1) return false;
  DST[i] = 2; DVX[i] = vx; DVZ[i] = vz; TUMBLE[i] = rand() * 6.28;
  down++; chain++; chainT = 1.2;
  const pts = chain >= 5 ? 3 : chain >= 3 ? 2 : 1;
  score += pts;
  fx.burst(6, { x: DX[i], y: 1, z: DZ[i], size: .35, life: .7, color: 0xffd34d }, 3);
  st.popup('+' + pts, { x: DX[i], y: 2.4, z: DZ[i] }, '#ffd34d', 6);
  sfx('thud', .5);
  if (chain === 10 || chain === 25 || chain === 50) { st.hitstop(.09); st.flash('#ffd34d', .25); st.kick(5); }
  shake = Math.min(shake + .1, .7);
  return true;
}

st.shell({ id: 'pigskin-bowl', title: 'Pigskin Bowl', sub: 'Bowl over 1000 defenders. TD = +7', onReset: () => { score = 0; drive = 1; reset(1); } });
reset(1);

addEventListener('pointerdown', e => { touching = true; touchX = e.clientX; });
addEventListener('pointermove', e => { if (touching) steer = clamp((e.clientX - touchX) / 120, -1, 1); });
addEventListener('pointerup', () => { touching = false; steer = 0; });

function update(dt) {
  fx.update(dt); walkClock.value = st.t;
  chainT -= dt; if (chainT <= 0) chain = 0;
  shake = Math.max(0, shake - dt * 2.2);
  if (shake > 0) st.shake(shake * .5);

  // --- player: auto-run +z, steer x ---
  const keys = st.keys;
  let ax = steer;
  if (keys['a'] || keys['ArrowLeft']) ax -= 1;
  if (keys['d'] || keys['ArrowRight']) ax += 1;
  pvx = clamp(pvx + ax * 42 * dt, -10, 10);
  pvx *= (1 - 2.4 * dt);
  px = clamp(px + pvx * dt, -FIELD_W / 2 + 1.6, FIELD_W / 2 - 1.6);
  pz += speed * dt;
  const sq = 1 + Math.min(Math.abs(pvx) / 16, .28);   // squash & stretch
  player.position.set(px, 0, pz);
  player.scale.set(sq, 1 / Math.sqrt(sq), 1);
  player.rotation.y = -pvx * .05;
  pShadow.set(0, px, pz, 3.2); pShadow.done(1);

  // --- rebuild spatial grid (standing defenders only) ---
  for (let g = 0; g < grid.length; g++) grid[g].length = 0;
  for (let i = 0; i < spawned; i++) if (DST[i] === 1) grid[gcell(DX[i], DZ[i])].push(i);

  // --- defenders ---
  const defSpeed = 4 + drive * .8;
  for (let i = 0; i < spawned; i++) {
    const s = DST[i];
    if (s === 1) {
      DVZ[i] = -defSpeed; DVX[i] = clamp((px - DX[i]) * .6, -3, 3);
      DX[i] += DVX[i] * dt; DZ[i] += DVZ[i] * dt;
      if (DZ[i] < pz - 14) { DST[i] = 0; continue; }            // ran past
      const ddx = DX[i] - px, ddz = DZ[i] - pz;                 // player bowl-over
      if (ddx * ddx + ddz * ddz < 3.61) {
        const a = Math.atan2(ddx, ddz) + (rand() - .5) * .6, pw = 14 + speed * .7;
        knockdown(i, Math.sin(a) * pw + pvx * .8, Math.cos(a) * pw + 4);
      }
    } else if (s === 2) {
      DX[i] += DVX[i] * dt; DZ[i] += DVZ[i] * dt;
      DVX[i] *= (1 - 2.5 * dt); DVZ[i] *= (1 - 2.5 * dt);
      TUMBLE[i] += dt * 9;
      // domino: check grid neighbors for standing defenders
      const cx = clamp(((DX[i] + FIELD_W / 2 + 2) / CELL) | 0, 0, COLS - 1);
      const rz = clamp(((DZ[i] - Z0) / CELL) | 0, 0, ROWS - 1);
      for (let gx = Math.max(0, cx - 1); gx <= Math.min(COLS - 1, cx + 1); gx++) {
        for (let gz = Math.max(0, rz - 1); gz <= Math.min(ROWS - 1, rz + 1); gz++) {
          const cell = grid[gz * COLS + gx];
          for (let k = 0; k < cell.length; k++) {
            const j = cell[k];
            if (j === i || DST[j] !== 1) continue;
            const ddx = DX[j] - DX[i], ddz = DZ[j] - DZ[i];
            if (ddx * ddx + ddz * ddz < 1.44) {
              const a2 = Math.atan2(ddx, ddz);
              if (knockdown(j, Math.sin(a2) * 9 + DVX[i] * .5, Math.cos(a2) * 9 + DVZ[i] * .5)) {
                DVX[i] *= .82; DVZ[i] *= .82;
              }
            }
          }
        }
      }
      if (Math.abs(DVX[i]) + Math.abs(DVZ[i]) < 1.2) DST[i] = 3;
      if (Math.abs(DX[i]) > FIELD_W / 2 + 4 || DZ[i] < Z0 || DZ[i] > FIELD_L + EZ + 10) DST[i] = 0;
    }
  }

  // --- touchdown ---
  if (pz >= FIELD_L + EZ - 2) {
    score += 7;
    st.hud.banner('TOUCHDOWN! +7', 1.6);
    st.popup('TOUCHDOWN +7', { x: px, y: 4, z: pz }, '#7dff7d', 9);
    sfx('fanfare', .8); st.hitstop(.15); st.flash('#fff', .4); st.kick(7);
    fx.burst(40, { x: px, y: 2, z: pz, size: .4, life: 1.2, color: 0xffd34d }, 8);
    drive++; reset(drive);
  }

  // --- HUD ---
  st.hud.left(`SCORE<br>${score}`);
  st.hud.right(`DRIVE ${drive}<br>${down}/${N_DEF} BOWLED`);
  st.hud.hint('A/D or drag to steer');
  if (chain >= 3) st.hud.banner(`x${chain} CHAIN!`, .12);
  window.__game = { score, drive, down, chain, px: +px.toFixed(2), pz: +pz.toFixed(2) };
}

function pre() {
  for (let i = 0; i < spawned; i++) {
    const s = DST[i];
    if (s === 0) { defs.set(i, 0, -50, 0, .001); continue; }
    if (s === 1) {
      defs.set(i, DX[i], Math.abs(Math.sin(st.t * 9 + i * 1.7)) * .12, DZ[i], 1, Math.atan2(DVX[i], DVZ[i]));
    } else if (s === 2) {
      defs.set(i, DX[i], .9, DZ[i], 1, 0, TUMBLE[i], .5);
    } else {
      defs.set(i, DX[i], .28, DZ[i], 1, 0, 0, Math.PI / 2 - .12);
    }
  }
  defs.done(spawned);
  const shx = (rand() - .5) * shake, shy = (rand() - .5) * shake;
  st.camera.position.set(px * .7 + shx, 9 + shy, pz - 11);
  st.camera.lookAt(px * .7, 0, pz + 7);
}
st.run(update, pre);
</script></body></html>
